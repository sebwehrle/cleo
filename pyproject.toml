[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleo"
version = "0.2.0"
description = "Cleo supports wind resource assessment with the Global Wind Atlas"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Sebastian Wehrle", email = "sebastian.wehrle@boku.ac.at"},
]
urls = {Homepage = "https://github.com/sebwehrle/cleo"}

# Dependency version policy (see docs/CONTRACT_UNIFIED_ATLAS.md Section C3):
# - Lower bounds are tested: CI job `test-min-deps` installs every direct dependency at exactly
#   its floor (uv --resolution lowest-direct, wheels only, Python 3.11) and runs the test suite.
#   A floor is raised only when that job shows it is needed; the comment says why.
# - Upper bounds: protective caps for ecosystem components with known breaking changes
dependencies = [
  # Core scientific stack
  "numpy>=2.0,<3",         # np.trapezoid (cleo/assess.py); <3 for future major protection
  "scipy>=1.13.0",         # NumPy 2 compatible wheels
  "pandas>=2.2.2",         # NumPy 2 compatible wheels

  # xarray ecosystem (fragile - version sensitive)
  "xarray>=2025.6.0",      # Zarr v3 stores and to_zarr(align_chunks=...) (materializers/region.py)
  "dask[array]>=2024.12.1",  # tested with the xarray floor
  "zarr>=3.1.0,<4",        # v3 required per CONTRACT B3 (3.1: Group.create_array(data=) used in tests); <4 for dtype stability

  # Geospatial stack
  "rasterio>=1.3.10",      # NumPy 2 compatible wheels (1.3.3 fails with a NumPy ABI error)
  "rioxarray>=0.14",       # clip/reproject API used by CLEO
  "geopandas>=0.14.4",     # NumPy 2 support (copy semantics)
  "pyproj>=3.4",           # PROJ 9.x compatibility
  "shapely>=2.0.4",        # NumPy 2 compatible wheels
  "xarray-spatial>=0.3.2", # focal operations; lowest release that resolves with wheels

  # I/O and serialization
  "netcdf4>=1.7.1.post1",  # NumPy 2 compatible wheels
  "pyyaml>=6.0",           # safe_load defaults
  "openpyxl>=3.1",         # xlsx read/write

  # Network and utilities
  "requests>=2.30.0",      # first release that allows urllib3 2.x
  "urllib3>=2.0.2",        # modern TLS defaults; lowest 2.x release that resolves
  "certifi>=2023.5.7",     # first 2023 CA bundle release
  "tqdm>=4.64",            # notebook/console detection

  # Domain-specific
  "pycountry>=23.12.7",    # ISO-3166 data; lowest release that resolves with wheels
  "pint>=0.24.4",          # NumPy 2 support (0.24.0 breaks with current flexparser)
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6",
  "mkdocstrings[python]>=0.26",
]
dev = [
  "pytest>=7.0",           # 7.0 for pythonpath config support
  "pytest-cov>=4.0",       # 4.0 for coverage 7.x compatibility
  "pytest-xdist>=3.8.0",     # 3.0 for parallel test execution
  "ruff==0.17.4",          # pin formatter/linter version to match CI and local pre-commit
  "detect-secrets==1.5.0", # pin secret scanner version to match CI and local maintainer checks
  "build>=1.0",            # 1.0 for PEP 517 build
  "psutil>=5.9",           # benchmark helper memory metrics
]

[tool.pytest.ini_options]
markers = [
  "slow: slower integration tests",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["cleo*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
cleo = ["resources/*.yml"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
]
ignore = [
    "E402",  # module-import-not-at-top-of-file (common for conditional imports and import guards)
    "E501",  # line-too-long (handled by formatter)
    "E731",  # do not assign a lambda expression
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "F841",  # unused-variable (common in tests for side-effect imports like pytest.importorskip)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
disable_error_code = [
    "attr-defined",
    "arg-type",
    "assignment",
    "call-overload",
    "index",
    "operator",
    "return-value",
    "type-var",
    "union-attr",
]
# Exclude tests and generated files
exclude = [
    "tests/",
    "build/",
    "dist/",
]

# Local development environment (pixi). CI keeps using pip; see CLAUDE.md.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.11.*"
# Native-library packages from conda-forge so both platforms get GDAL/PROJ/HDF5 binaries.
netcdf4 = "*"
pyogrio = "*"
pyproj = "*"
rasterio = "*"
# Gate tools not in the [dev] extra.
radon = "*"
ripgrep = "*"

[tool.pixi.pypi-dependencies]
cleo = { path = ".", editable = true }

[tool.pixi.environments]
default = ["dev", "docs"]

[tool.pixi.tasks]
lint = "ruff format --check . && ruff check ."
test = "pytest -q tests/unit tests/integration tests/smoke"
contract = "tools/check_contract.sh"
complexity = "tools/check_complexity.sh"
docs = "mkdocs build --strict"
secret-scan = "tools/secret_scan.sh --all"
build = "python -m build"
gate = { depends-on = ["lint", "test", "contract", "complexity", "docs", "secret-scan", "build"] }
