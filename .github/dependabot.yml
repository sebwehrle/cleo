# Dependabot configuration for automated dependency updates.
# Conservative settings: weekly updates, limited PRs, no major version bumps.
#
# Note: After merging Dependabot PRs, regenerate requirements-lock.txt:
#   pip-compile --upgrade --output-file=requirements-lock.txt --strip-extras pyproject.toml

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    # Floors in pyproject.toml are tested minimums (CI job test-min-deps): only raise one when a
    # new release falls outside the allowed range, never just because a newer version exists.
    versioning-strategy: increase-if-necessary
    labels:
      - "dependencies"
    ignore:
      # Skip major version bumps - review manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
